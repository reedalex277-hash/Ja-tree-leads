<!doctype html>
<html lang="en">
<head>

  <style>

      max-width: 760px;
      margin: auto;
      padding: 50px 22px;
    }

      border-radius: 18px;

    }
    .small {
            color: #b9c5bc;
      line-height: 1.6;
    }

</head>

<body>
  <main class="wrap">
    <div class="card">
      <div class="status">SYSTEM ONLINE</div>

      <h1>J&A <span class="green">Tree Leads</span></h1>

      <p class="small">
        Local tree-service lead generation and qualification system.
      </p>

      <h2>Lead Hunter</h2>

      <p class="small">
        Local targeting, opportunity scoring, duplicate filtering and
        lead management are being connected here.
      </p>

      <p><strong>J&A Tree & Lawn Service</strong></p>
    </div>
