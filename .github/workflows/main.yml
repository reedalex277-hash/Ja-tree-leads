import streamlit as st
import pandas as pd
import requests

st.title("J&A Local B2B Lead Hunter")

# 1. Your target service region
TARGET_CITIES = ["Crossville, TN", "Cookeville, TN", "Sparta, TN", "Monterey, TN", "Jamestown, TN", "Rickman, TN"]

# 2. Business types that constantly need tree/lawn contractors
TARGET_NICHES = {
    "Property Management": "property management",
    "Real Estate Agency": "real estate agency",
    "General Contractors": "general contractor",
    "Golf Courses / Parks": "golf course"
}

selected_city = st.selectbox("Select Target Service Area:", TARGET_CITIES)
selected_niche = st.selectbox("Select Target Business Type:", list(TARGET_NICHES.keys()))

# Securely grab your Google API Key from Vercel Environment Variables
GOOGLE_API_KEY = st.secrets.get("GOOGLE_PLACES_API_KEY")

if st.button("Hunt Local Leads"):
    if not GOOGLE_API_KEY:
        st.error("Missing API Key! Please set GOOGLE_PLACES_API_KEY in your Vercel Environment Variables.")
    else:
        st.write(f"Searching for {selected_niche} leads in {selected_city}...")
        
        # Querying the Google Places Text Search API
        search_query = f"{TARGET_NICHES[selected_niche]} in {selected_city}"
        url = f"https://googleapis.com{search_query}&key={GOOGLE_API_KEY}"
        
        response = requests.get(url).json()
        
        if "results" in response and len(response["results"]) > 0:
            leads_list = []
            
            for place in response["results"]:
                leads_list.append({
                    "Business Name": place.get("name"),
                    "Address": place.get("formatted_address"),
                    "Rating": place.get("rating", "N/A"),
                    "Status": "Operational" if place.get("business_status") == "OPERATIONAL" else "Unknown"
                })
            
            df = pd.DataFrame(leads_list)
            st.dataframe(df)
            
            # Export to a structured CSV file for outreach tracking
            csv = df.to_csv(index=False).encode('utf-8')
            st.download_button(
                label="Download Leads as CSV",
                data=csv,
                file_name=f"tree_lawn_leads_{selected_city.split(',')[0].lower()}.csv",
                mime="text/csv"
            )
        else:
            st.warning("No prospective businesses found for this specific selection.")
            
